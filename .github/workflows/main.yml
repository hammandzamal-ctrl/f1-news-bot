name: F1 News Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

      - name: Save news state
        run: |
          git config user.name "F1 News Bot"
          git config user.email "actions@github.com"
          git add last_news.json
          git diff --cached --quiet || git commit -m "Update news state"
          git push
